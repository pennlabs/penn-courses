[project]
name = "penn-course-mcp"
version = "0.1.0"
description = "An MCP server for Penn course planning, built on the open-source Penn Courses (Penn Course Plan / Review) public API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grant DeHoog" }]
keywords = ["mcp", "penn", "courses", "upenn", "course-planning", "llm"]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2",
    "cachetools>=5",
]

[project.optional-dependencies]
dev = [
    "black==22.3.0",
    "flake8==7.1.1",
    "flake8-isort==6.1.1",
    "flake8-quotes==3.4.0",
    "isort==5.13.2",
    "pytest==8.3.3",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
penn-course-mcp = "penn_course_mcp.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penn_course_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
